name: Daily stats refresh

on:
  schedule:
    # 09:00 UK time (08:00 UTC in summer, 09:00 UTC in winter — run at 08:30 UTC as a compromise)
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily refresh
        run: python scripts/daily_refresh.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.json assets/projects.json \
                  portfolio_videos.json portfolio_longform.json \
                  portfolio_shorts.json portfolio_data.js \
                  scripts/shorts_cache.json
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "Daily stats refresh"
            git push
          fi
